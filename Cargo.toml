[package]
name = "booksmart"
version = "0.2.0"
edition = "2024"
authors = ["Mark Ryall"]
description = "A terminal bookmark launcher: fuzzy-filter TOML bookmarks and open them in the right browser space"
license = "MIT OR Apache-2.0"
repository = "https://github.com/markryall/booksmart"
readme = "README.md"
keywords = ["cli", "tui", "bookmarks", "browser", "launcher"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md"]

[dependencies]
anyhow = "1.0.104"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", features = ["preserve_order"] }
toml_edit = "0.25.17"

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3.27.0"
vt100 = "0.18.1"
