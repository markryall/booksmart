description = "Urls may hold {1} {2}.. and {*} placeholders. Decision: Enter on a templated bookmark opens an inline prompt (typing args into the filter would filter the bookmark away, since the match is fuzzy across words). Words fill {1} {2}.. in order and {*} takes the rest joined with spaces; values are url-escaped; the filled url previews live as you type. Enter opens, Esc returns to the list, a missing value names its placeholder. A direct 'booksmart <name> <args>' command is a later card."
